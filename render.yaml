services:
  - type: web
    name: codesentinel-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.scripts.seed_demo_data && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONPATH
        value: .
      - key: APP_NAME
        value: CodeSentinel
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./codesentinel.db
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GITHUB_REDIRECT_URI
        value: https://codesentinel-api-y2k1.onrender.com/api/v1/auth/github/callback
      - key: GITHUB_CLIENT_ID
        value: Ov23liDZLgmewzZOPhWm
      - key: GITHUB_CLIENT_SECRET
        value: ebedc533945be87cb680cf8342a0f8d1718b9120
      - key: GITHUB_WEBHOOK_SECRET
        value: 4076b5456b0be216a05bd90cf3a999adee78fe5748e54bffd80343b1bb112913
